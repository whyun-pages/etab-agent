# `.verify/` is a workspace package so its one dependency (exceljs, the
# independent reference implementation the offline probes compare against)
# lives in the same lockfile as everything else. It is never bundled, and
# `.verify/` is not on the release path.
packages:
  - .verify

allowBuilds:
  # esbuild ships its binary as a per-platform optional dependency; its install
  # script only re-verifies that binary, so it is not needed.
  esbuild: false
  # Pulled in by @earendil-works/pi-ai. Neither install script is needed at
  # runtime: @google/genai's is an `echo` no-op, and protobufjs's only prints a
  # version-scheme warning.
  '@google/genai': false
  protobufjs: false
